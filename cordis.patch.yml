- insert:
    - id: codegraph-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: codegraph
        transport: stdio
        command: 'C:/Users/dupengair/AppData/Roaming/npm/node_modules/@colbymchenry/codegraph/node_modules/@colbymchenry/codegraph-win32-x64/node.exe'
        args:
          - --liftoff-only
          - --disable-warning=ExperimentalWarning
          - 'C:/Users/dupengair/AppData/Roaming/npm/node_modules/@colbymchenry/codegraph/node_modules/@colbymchenry/codegraph-win32-x64/lib/dist/bin/codegraph.js'
          - serve
          - --mcp
        env:
          CODEGRAPH_MCP_TOOLS: 'explore,node,search,callers,callees,impact,files,status'
        failOnStartupError: true
        toolCallTimeoutMs: 120000
